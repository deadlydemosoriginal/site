# Sveltia CMS — the /admin editor.
#
# These collections mirror the Zod schemas in src/content.config.ts. If you
# change a schema there, change it here too, or the CMS will happily write
# frontmatter that fails the next build.
#
# Auth needs a free Cloudflare Worker (Sveltia's GitHub authenticator) plus a
# GitHub OAuth app. Set base_url to the Worker's URL once it exists.
backend:
  name: github
  repo: deadlydemosoriginal/site
  branch: main
  # base_url: https://your-auth-worker.workers.dev

site_url: https://deadlydemos.com
display_url: https://deadlydemos.com
logo_url: /brand/dd-mark.png

media_folder: public/uploads
public_folder: /uploads

# Filenames made from titles: plain lowercase ASCII, no accents or symbols.
slug:
  encoding: ascii
  clean_accents: true

# Editing goes via a PR-style workflow so a bad save never breaks the live site.
publish_mode: editorial_workflow

collections:
  - name: shows
    label: Shows
    label_singular: Show
    description: "Radio episodes. Upload the MP3 to R2 first, then paste its link into Audio URL."
    folder: src/content/shows
    preview_path: "shows/{{slug}}"
    sortable_fields: { fields: [episode, date, title], default: { field: episode, direction: descending } }
    create: true
    slug: "{{episode}}-{{slug}}"
    summary: "№{{episode}} — {{title}}"
    fields:
      - { name: title, label: Title, widget: string, hint: "The episode name, e.g. Basement Tapes & Broken Machines." }
      - { name: episode, label: Episode number, widget: number, value_type: int, min: 1, hint: "Just the number — no № or #." }
      - { name: date, label: Broadcast date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD MMM YYYY", time_format: false, default: "{{now}}" }
      - name: hosts
        label: Hosts
        widget: relation
        collection: members
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
        multiple: true
        hint: "Everyone who presented this episode."
      - { name: description, label: Description, widget: text, hint: "One or two sentences. Shows on the episode card and when shared." }
      - name: audioUrl
        label: Audio URL
        widget: string
        required: false
        hint: "Public MP3 URL on Cloudflare R2 (audio.deadlydemos.com/...). Upload the file to R2 first — MP3s must never go in this repo."
      - { name: duration, label: Duration, widget: string, required: false, pattern: ['^\d{1,2}:\d{2}:\d{2}$', "Use HH:MM:SS"], hint: "Running time as hours:minutes:seconds, e.g. 01:58:20." }
      - { name: artwork, label: Artwork, widget: image, required: false, hint: "Optional. Without it, a colour-blocked cover is generated from the episode number." }
      - { name: tone, label: Colour tone, widget: select, options: [purple, ultrasonic, periwinkle, paper, ink], default: purple, hint: "Background colour for the cover when there's no artwork." }
      - { name: tags, label: Tags, widget: list, default: [], hint: "Genres or themes, lowercase, separated by commas — e.g. dub, industrial." }
      - name: tracklist
        label: Tracklist
        widget: list
        required: false
        label_singular: Track
        hint: "Add tracks in the order they were played."
        summary: "{{fields.artist}} — {{fields.title}}"
        fields:
          - { name: artist, label: Artist, widget: string }
          - { name: title, label: Track, widget: string }
          - { name: timestamp, label: Timestamp, widget: string, required: false, hint: "M:SS or H:MM:SS — makes this track a seek link in the player." }
      - { name: featured, label: Feature on homepage, widget: boolean, default: false, hint: "Puts this episode in the big slot on the homepage." }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Show notes, widget: markdown, required: false, hint: "Optional longer write-up shown on the episode page." }
      # Waveform data generated offline — never edited here, but kept so saving a show doesn't wipe it.
      - { name: peaks, widget: hidden }

  - name: articles
    label: Articles
    label_singular: Article
    description: "Essays, reviews and features. Tick Draft to keep a piece off the site while you work on it."
    folder: src/content/articles
    preview_path: "articles/{{slug}}"
    create: true
    slug: "{{slug}}"
    sortable_fields: { fields: [date, title], default: { field: date, direction: descending } }
    fields:
      - { name: title, label: Headline, widget: string }
      - { name: standfirst, label: Standfirst, widget: text, hint: "The intro paragraph under the headline — one or two sentences that sell the piece." }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD MMM YYYY", time_format: false, default: "{{now}}" }
      - name: author
        label: Author
        widget: relation
        collection: members
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
      - { name: heroImage, label: Hero image, widget: image, required: false, hint: "Optional. A wide photo works best (landscape, at least 1600px across)." }
      - { name: tone, label: Colour tone, widget: select, options: [purple, ultrasonic, periwinkle, paper, ink], default: paper, hint: "Colour of the article's card on the Articles page." }
      - { name: tags, label: Tags, widget: list, default: [], hint: "Lowercase, separated by commas — e.g. essay, review." }
      - { name: draft, label: Draft, widget: boolean, default: false, hint: "Ticked = hidden from the site. Untick when it's ready to go out." }
      - { name: body, label: Body, widget: markdown, hint: "Use the toolbar for headings, bold, links and quotes." }

  - name: playlists
    label: Playlists
    label_singular: Playlist
    description: "Spotify playlists. The tracklist and cover are pulled from Spotify automatically."
    folder: src/content/playlists
    preview_path: "playlists/{{slug}}"
    create: true
    slug: "{{slug}}"
    sortable_fields: { fields: [date, title], default: { field: date, direction: descending } }
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text, hint: "One or two sentences about the mood." }
      - { name: spotifyUrl, label: Spotify URL, widget: string, pattern: ['^https://open\.spotify\.com/playlist/', "Must be an open.spotify.com playlist link"], hint: "In Spotify: ⋯ → Share → Copy link to playlist, then paste here." }
      - name: curator
        label: Curator
        widget: relation
        collection: members
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD MMM YYYY", time_format: false, default: "{{now}}" }
      - { name: tone, label: Colour tone, widget: select, options: [purple, ultrasonic, periwinkle, paper, ink], default: ultrasonic }
      - name: tracks
        label: Tracklist (fallback)
        widget: list
        required: false
        summary: "{{fields.artist}} — {{fields.title}}"
        hint: "You can usually leave this empty — the tracklist comes from Spotify."
        fields:
          - { name: artist, label: Artist, widget: string }
          - { name: title, label: Track, widget: string }
      - { name: draft, label: Draft, widget: boolean, default: false, hint: "Ticked = hidden from the site." }
      - { name: body, label: Sleeve note, widget: markdown, required: false, hint: "Optional. A short note about the playlist." }

  - name: members
    label: Members
    label_singular: Member
    description: "Your bio and links on the About page."
    folder: src/content/members
    preview_path: about
    # Bios are edit-only — a new member file also needs a GitHub account set up.
    create: false
    slug: "{{slug}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Name, widget: string }
      - { name: role, label: Role, widget: string, hint: "One line under your name, e.g. Playlists, digging, and the archive." }
      - { name: order, label: Sort order, widget: number, value_type: int, default: 0, hint: "Position on the About page — 1 is first." }
      - { name: photo, label: Photo, widget: image, required: false, hint: "Optional. Square works best. Without one, a coloured block with your initial is shown." }
      - name: links
        label: Links
        widget: list
        required: false
        summary: "{{fields.label}}"
        fields:
          - { name: label, label: Label, widget: string, hint: "e.g. Instagram" }
          - { name: url, label: URL, widget: string, pattern: ['^(https?://|mailto:)', "Must start with https:// (or mailto: for an e-mail address)"], hint: "Full link, e.g. https://www.instagram.com/yourname" }
      - { name: body, label: Bio, widget: markdown }
