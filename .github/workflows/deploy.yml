name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild hourly so the Instagram reels row stays current.
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Duration + waveform for shows with audio, worked out from the MP3 once
      # and kept in the Actions cache (not the repo). See scripts/audio-meta.mjs.
      - uses: actions/cache/restore@v4
        with:
          path: .cache/audio-meta.json
          key: audio-meta-${{ github.run_id }}
          restore-keys: audio-meta-

      - id: audio-check
        run: npm run audio-meta -- --check
        continue-on-error: true

      # The runner image doesn't ship ffmpeg; only install it when a show
      # actually needs analysing, so the hourly rebuilds stay quick.
      - if: steps.audio-check.outputs.pending != '' && steps.audio-check.outputs.pending != '0'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
        continue-on-error: true

      - if: steps.audio-check.outputs.pending != '' && steps.audio-check.outputs.pending != '0'
        run: npm run audio-meta
        continue-on-error: true

      - uses: actions/cache/save@v4
        if: hashFiles('.cache/audio-meta.json') != ''
        continue-on-error: true
        with:
          path: .cache/audio-meta.json
          key: audio-meta-${{ hashFiles('.cache/audio-meta.json') }}

      # Log is kept so a failed build can be reported back in plain sight.
      - run: set -o pipefail; npm run build 2>&1 | tee build.log
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}

      # A bad CMS save fails the build and the live site simply stays as it
      # was — this makes sure someone actually hears about it. One open issue
      # at a time; later failures add a comment instead of piling up.
      - name: Report failed build
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The site didn't update. The live site is fine — it's still showing the last good version."
            echo
            echo "Most likely a recent edit has a field in the wrong format. The error below names the file and the field."
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            grep -iE -A8 'error|invalid|failed' build.log | tail -n 60 || tail -n 60 build.log
            echo '```'
          } > report.md
          existing=$(gh issue list --state open --search 'in:title "Site build failed"' --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file report.md
          else
            gh issue create --title "Site build failed" --body-file report.md
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
